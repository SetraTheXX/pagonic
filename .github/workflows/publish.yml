name: Publish package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish"
        required: true
        type: string
        default: v0.5.1
      index:
        description: "Package index to publish to"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.index }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out selected source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify workflow ref and source tag
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$WORKFLOW_REF_TYPE" != "branch" ] || [ "$WORKFLOW_REF_NAME" != "main" ]; then
            echo "Dispatch this workflow from the main branch."
            exit 1
          fi

          case "$SOURCE_TAG" in
            v*) ;;
            *)
              echo "Expected a source tag beginning with v, got: $SOURCE_TAG"
              exit 1
              ;;
          esac

          if ! git rev-parse --verify "refs/tags/$SOURCE_TAG^{commit}" >/dev/null 2>&1; then
            echo "Source tag does not exist: $SOURCE_TAG"
            exit 1
          fi

          CHECKED_OUT_TAG="$(git describe --tags --exact-match HEAD)"
          if [ "$CHECKED_OUT_TAG" != "$SOURCE_TAG" ]; then
            echo "Checked out $CHECKED_OUT_TAG instead of $SOURCE_TAG"
            exit 1
          fi

          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$SOURCE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $SOURCE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Verify distribution set
        run: |
          python - <<'PY'
          from pathlib import Path

          files = sorted(path.name for path in Path("dist").iterdir() if path.is_file())
          wheels = [name for name in files if name.endswith(".whl")]
          sdists = [name for name in files if name.endswith(".tar.gz")]
          if len(files) != 2 or len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected exactly one wheel and one sdist, found: {files}")
          print("Built distributions:", ", ".join(files))
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to ${{ inputs.index }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.index }}
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Publish to PyPI
        if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
