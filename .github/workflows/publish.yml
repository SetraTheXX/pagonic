name: Publish package

on:
  workflow_dispatch:
    inputs:
      index:
        description: "Package index to publish to"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.index }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify version tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "Publishing is allowed only from a version tag."
            exit 1
          fi

          case "$REF_NAME" in
            v*) ;;
            *)
              echo "Expected a version tag beginning with v, got: $REF_NAME"
              exit 1
              ;;
          esac

          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $REF_NAME does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Verify distribution set
        run: |
          python - <<'PY'
          from pathlib import Path

          files = sorted(path.name for path in Path("dist").iterdir() if path.is_file())
          wheels = [name for name in files if name.endswith(".whl")]
          sdists = [name for name in files if name.endswith(".tar.gz")]
          if len(files) != 2 or len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected exactly one wheel and one sdist, found: {files}")
          print("Built distributions:", ", ".join(files))
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to ${{ inputs.index }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.index }}
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@4bb033805d9e19112d8c697528791ff53f6c2f74 # v1.9.0
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Publish to PyPI
        if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@4bb033805d9e19112d8c697528791ff53f6c2f74 # v1.9.0
        with:
          packages-dir: dist/
