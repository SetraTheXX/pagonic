name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        run: python -m pytest -q --cov=Pagonic --cov-report=term-missing

      - name: Run comprehensive tests
        run: python -m pytest -q --comprehensive

      - name: Build package
        run: python -m build

      - name: Install and smoke-test wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -Path dist -Filter "*.whl" | Select-Object -First 1
          if (-not $wheel) {
            throw "Wheel build did not produce a .whl file"
          }
          python -m pip install --force-reinstall --no-deps $wheel.FullName
          pagonic --version
          pagonic inspect --help
          pagonic verify --help
          pagonic safe-extract --help

      - name: Check installed packages
        run: python -m pip check

      - name: CLI smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path smoke-out -Force | Out-Null
          Set-Content -Path smoke.txt -Value "hello from ci"
          pagonic --help
          pagonic --version
          pagonic compress smoke.txt -o smoke.zip
          pagonic inspect smoke.zip --json
          pagonic inspect smoke.zip --markdown
          pagonic verify smoke.zip
          pagonic list smoke.zip --tree
          pagonic safe-extract smoke.zip smoke-out
          if (-not (Test-Path "smoke-out/smoke.txt")) {
            throw "safe-extract did not create smoke-out/smoke.txt"
          }
