name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        run: python -m pytest -q

      - name: Build package
        run: python -m build

      - name: Check installed packages
        run: python -m pip check

      - name: CLI smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path smoke-out -Force | Out-Null
          Set-Content -Path smoke.txt -Value "hello from ci"
          pagonic --help
          pagonic --version
          pagonic compress smoke.txt -o smoke.zip
          pagonic inspect smoke.zip --json
          pagonic inspect smoke.zip --markdown
          pagonic verify smoke.zip
          pagonic list smoke.zip --tree
          pagonic safe-extract smoke.zip smoke-out
          if (-not (Test-Path "smoke-out/smoke.txt")) {
            throw "safe-extract did not create smoke-out/smoke.txt"
          }
